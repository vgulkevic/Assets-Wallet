// Local production build. To build and upload with config from terraform outputs use backend:category-api:deployFrontend
tasks.register('packFrontend', Exec) {
    doFirst {
        println "packing frontend to ${project.findProperty('stage')}.."
    }
    // only pass properties that are set, so values in frontend/.env.local are not overridden with blanks
    [VITE_API_URL: 'api_url', VITE_STAGE: 'stage', VITE_REGION: 'aws_region',
     VITE_USER_POOL_ID: 'userPoolId', VITE_USER_POOL_CLIENT_ID: 'userPoolWebClientId'].each { env, prop ->
        if (project.findProperty(prop)) environment env, project.property(prop)
    }

    commandLine 'npm', 'run', 'build'
}
