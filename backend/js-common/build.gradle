tasks.register('install', Exec) {
    doFirst {
        println "installing node modules.."
    }
    workingDir 'nodejs'
    // clean install of production dependencies only, exactly as pinned in package-lock.json
    commandLine 'npm', 'ci', '--omit=dev'
}

tasks.register('packageLayer', Exec) {
    dependsOn 'install'
    doFirst {
        println "packaging $project.name.."
    }
    commandLine 'zip', '-9', '-FS', '-r', 'function.zip', 'nodejs'
}
