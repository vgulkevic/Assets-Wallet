// each subproject contains a lambda; the layer in backend:js-common provides its node modules

subprojects {
    tasks.register('packageLambda', Exec) {
        doFirst {
            println "packaging $project.name.."
        }
        commandLine 'zip', '-9', '-FS', '-r', 'function.zip', '.', '-x', 'function.zip', '-x', '.idea/*'
    }
}

def deployTask(String action) {
    def stage = project.property('stage')
    return ['bash', '../../terraform-common/deploy.sh',
            '-a', action,
            '-p', project.property('aws_profile'),
            '-b', "${project.property('tf_bucket')}${stage}",
            '-k', project.property('tf_bucket_key'),
            '-s', stage,
            '-f', "${project.property('frontend_bucket_name')}${stage}",
            '-r', project.property('aws_region')]
}

// 1. plan: package everything and write terraform/tfplan. Read the output before applying!
tasks.register('plan', Exec) {
    dependsOn subprojects.collect { "${it.path}:packageLambda" }, ':backend:js-common:packageLayer'
    commandLine deployTask('plan')
}

// 2. apply: apply exactly the plan reviewed in step 1
tasks.register('apply', Exec) {
    commandLine deployTask('apply')
}

// 3. deployFrontend: build the frontend from terraform outputs and upload it
tasks.register('deployFrontend', Exec) {
    commandLine deployTask('frontend')
}
